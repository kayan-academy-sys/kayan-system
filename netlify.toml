[build]
  command = "npm ci"
  publish = "src/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["ejs", "pg"]
  included_files = ["src/views/**", "src/public/**", "migrations/**"]

# Static assets from the publish dir (CDN), everything else to the function.
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
